# Round 3 audit, 2026-11-13: records that would enter a public top 10 of a care board.
# Evidence tools: data/audit/round3/evidence.py (leg profile, fix quality, flock neighbours) and wind.py
# (NCEP/NCAR reanalysis tailwind and implied airspeed). Airspeeds are compared with Alerstam et al. 2007,
# PLoS Biol 5:e197, Protocol S1 (equivalent airspeed Ue): a record passes when its implied mean Ue is at
# most the species value + 4 m/s (about 2 SD of the within-species spread in that table).

