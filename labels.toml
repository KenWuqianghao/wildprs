# Record labels. Each one is a review decision with its evidence in the reason.
# A label wins over the automatic rules.
# Fields: category (key, list of keys, or "*"), doi (or "*"), animal (individual id or "*"),
# state (credible | under_review | artefact), reason (shown on the site and in the audit).
# The most specific matching label wins: animal, then doi, then category.

# Caspian terns, investigated 2026-11-13. Spring flights over the Sahara at 3.7 to 5.4 km height
# with ground speeds of 100 to 150 km/h for many hours. The tracks are smooth and the clock is
# consistent (median flight speed 32 km/h over 398,075 legs of 4 to 6 min), so a sensor fault is
# not likely. The speeds need a tailwind of 60 to 100 km/h; the wind check (NCEP reanalysis,
# NOAA PSL) was refused by the server (HTTP 429). Round 3 checked the wind for the flights that reach a
# public top 10; the labels per animal below decide those. All other tern speed records stay open.
[[label]]
category = ["biggest-day", "fastest-hour", "sahara", "mediterranean", "alps",
            "strait-of-gibraltar", "bosphorus-to-sinai", "tropics-of-africa"]
doi = "doi:10.5441/001/1.hg1v55ct"
animal = "*"
state = "under_review"
reason = "Caspian tern speed question: smooth GPS tracks at 100-150 km/h, 3.7-5.4 km high over the Sahara; tailwind not yet checked"

[[label]]
